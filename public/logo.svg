<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="sageBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3c5246"/>
      <stop offset="100%" stop-color="#2a3c32"/>
    </radialGradient>
    
    <!-- Warm Champagne Gold -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf5"/>
      <stop offset="50%" stop-color="#e8dec8"/>
      <stop offset="100%" stop-color="#cfbc98"/>
    </linearGradient>

    <!-- Sun rays glow -->
    <linearGradient id="rayGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#cfbc98" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#e8dec8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fdfbf5" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#sageBg)"/>

  <!-- Sunburst Rays Arc (28 delicate rays radiating upwards) -->
  <g id="sunburst" transform="translate(250, 215)">
    <!-- Arc mask / horizon -->
    <path d="M -115,0 A 115,115 0 0,1 115,0" fill="none" stroke="url(#goldText)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Radiating sun rays -->
    <line x1="0" y1="-50" x2="0" y2="-100" stroke="url(#rayGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="-48" x2="-28" y2="-96" stroke="url(#rayGrad)" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="15" y1="-48" x2="28" y2="-96" stroke="url(#rayGrad)" stroke-width="2.8" stroke-linecap="round"/>
    
    <line x1="-30" y1="-44" x2="-55" y2="-88" stroke="url(#rayGrad)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="30" y1="-44" x2="55" y2="-88" stroke="url(#rayGrad)" stroke-width="2.6" stroke-linecap="round"/>
    
    <line x1="-44" y1="-38" x2="-78" y2="-76" stroke="url(#rayGrad)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="44" y1="-38" x2="78" y2="-76" stroke="url(#rayGrad)" stroke-width="2.4" stroke-linecap="round"/>
    
    <line x1="-56" y1="-30" x2="-98" y2="-60" stroke="url(#rayGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="56" y1="-30" x2="98" y2="-60" stroke="url(#rayGrad)" stroke-width="2.2" stroke-linecap="round"/>
    
    <line x1="-66" y1="-20" x2="-112" y2="-40" stroke="url(#rayGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="66" y1="-20" x2="112" y2="-40" stroke="url(#rayGrad)" stroke-width="2" stroke-linecap="round"/>
    
    <line x1="-74" y1="-10" x2="-120" y2="-20" stroke="url(#rayGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="74" y1="-10" x2="120" y2="-20" stroke="url(#rayGrad)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Intermediate finer micro-rays -->
    <line x1="-8" y1="-49" x2="-15" y2="-98" stroke="url(#rayGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="8" y1="-49" x2="15" y2="-98" stroke="url(#rayGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="-22" y1="-46" x2="-42" y2="-92" stroke="url(#rayGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="22" y1="-46" x2="42" y2="-92" stroke="url(#rayGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="-37" y1="-41" x2="-68" y2="-82" stroke="url(#rayGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="37" y1="-41" x2="68" y2="-82" stroke="url(#rayGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="-50" y1="-34" x2="-89" y2="-68" stroke="url(#rayGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="50" y1="-34" x2="89" y2="-68" stroke="url(#rayGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="-61" y1="-25" x2="-105" y2="-50" stroke="url(#rayGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="61" y1="-25" x2="105" y2="-50" stroke="url(#rayGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="-70" y1="-15" x2="-116" y2="-30" stroke="url(#rayGrad)" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
    <line x1="70" y1="-15" x2="116" y2="-30" stroke="url(#rayGrad)" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Typography: Solar -->
  <text x="250" y="260" 
        text-anchor="middle" 
        font-family="'Cormorant Garamond', 'Playfair Display', 'Cinzel', serif" 
        font-size="82" 
        font-weight="400" 
        font-style="italic"
        letter-spacing="1" 
        fill="url(#goldText)">
    Solar
  </text>
  
  <!-- Subtle wave inside the 'o' of Solar (centered around x=206, y=238) -->
  <path d="M 197,236 Q 206,231 215,236" fill="none" stroke="url(#goldText)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Typography: Zensorial -->
  <text x="250" y="340" 
        text-anchor="middle" 
        font-family="'Cormorant Garamond', 'Playfair Display', 'Cinzel', serif" 
        font-size="88" 
        font-weight="300" 
        letter-spacing="0.5" 
        fill="url(#goldText)">
    Zensorial
  </text>

  <!-- Typography: Espaçoterapias -->
  <text x="250" y="385" 
        text-anchor="middle" 
        font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" 
        font-size="20" 
        font-weight="500" 
        letter-spacing="6" 
        fill="#cfbc98">
    Espaçoterapias
  </text>
</svg>
